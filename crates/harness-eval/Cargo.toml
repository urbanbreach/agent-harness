[package]
name = "harness-eval"
description = "Native persistent code execution and tool composition for Harness"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
deno_core = "0.412"
deno_runtime = { version = "0.267", features = ["transpile"] }
deno_resolver = { version = "0.90", features = ["sync", "deno_ast"] }
node_resolver = { version = "0.97", features = ["sync"] }
deno_ast = { version = "0.53.3", features = ["transpiling", "visit"] }
deno_error = "=0.7.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
futures-util = "0.3"
base64 = "0.23"
sys_traits = { version = "0.1.28", features = ["real"] }
rustix = { version = "1.1.4", features = ["process"] }

[build-dependencies]
deno_core = "0.412"
deno_runtime = { version = "0.267", features = ["snapshot"] }

[[bin]]
name = "harness-eval-worker"
path = "src/main.rs"

[lints]
workspace = true
