stages:
  - test
  - secret-detection

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"
  INSTA_UPDATE: "no"
  TZ: "UTC"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  TERM: "xterm-256color"
  HARNESS_DETERMINISTIC: "1"
  HARNESS_DISABLE_ANIMATIONS: "1"
  HARNESS_SEED: "42"
  NEXTEST_PROFILE: "ci"
  CARGO_NEXTEST_VERSION: "0.9.98"
  CARGO_LLVM_COV_VERSION: "0.6.18"

.rust_cache: &rust_cache
  key: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry/
    - .cargo/git/

.rust_nextest_before_script: &rust_nextest_before_script
  - rustup component add rustfmt clippy
  - cargo install cargo-nextest --version "${CARGO_NEXTEST_VERSION}" --locked

.nextest_junit_artifacts: &nextest_junit_artifacts
  when: always
  expire_in: 1 week
  reports:
    junit:
      - target/nextest/ci/junit.xml
  paths:
    - target/nextest/

.perf_junit_artifacts: &perf_junit_artifacts
  when: always
  expire_in: 1 week
  reports:
    junit:
      - target/nextest/perf/junit.xml
  paths:
    - target/nextest/perf/

.coverage_artifacts: &coverage_artifacts
  when: always
  expire_in: 1 week
  paths:
    - target/coverage/
    - docs/test-suite-coverage-baseline.txt

.pty_visual_artifacts_always: &pty_visual_artifacts_always
  when: always
  expire_in: 1 week
  paths:
    - target/pty-visual-artifacts/

sast:
  stage: test

secret_detection:
  stage: secret-detection

rust:quality_gates:
  stage: test
  image: python:3.12
  script:
    - python3 scripts/check-test-suite-gates.py
    - python3 scripts/check-forbidden-branding.py

rust:fmt:
  stage: test
  image: rust:latest
  cache: *rust_cache
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --all -- --check

rust:clippy:
  stage: test
  image: rust:latest
  cache: *rust_cache
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --workspace --all-targets --all-features -- -D warnings

rust:build_harness:
  stage: test
  image: rust:latest
  cache: *rust_cache
  script:
    - cargo build -p harness --locked
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/debug/harness

rust:test_nextest:
  stage: test
  image: rust:latest
  cache: *rust_cache
  before_script: *rust_nextest_before_script
  script:
    - cargo nextest run --profile ci --workspace --all-features
  artifacts: *nextest_junit_artifacts

rust:perf:
  stage: test
  image: rust:latest
  cache: *rust_cache
  before_script: *rust_nextest_before_script
  script:
    - cargo nextest run --profile perf --workspace --all-features
  artifacts: *perf_junit_artifacts

rust:coverage:
  stage: test
  image: rust:latest
  cache: *rust_cache
  before_script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-nextest --version "${CARGO_NEXTEST_VERSION}" --locked
    - cargo install cargo-llvm-cov --version "${CARGO_LLVM_COV_VERSION}" --locked
  script:
    - scripts/coverage-ratchet.sh
  artifacts: *coverage_artifacts

rust:pty_e2e:
  stage: test
  image: rust:latest
  cache: *rust_cache
  needs:
    - job: rust:build_harness
      artifacts: true
  script:
    - export HARNESS_VISUAL_ARTIFACT_DIR=target/pty-visual-artifacts
    - env RUST_TEST_THREADS=1 cargo test -p harness-testkit --test pty_e2e
    - env RUST_TEST_THREADS=1 HARNESS_TUI_PTY_SIGNOFF=1 cargo test -p harness-tui --test pty_e2e
  artifacts: *pty_visual_artifacts_always

rust:binary_smoke:
  stage: test
  image: rust:latest
  cache: *rust_cache
  needs:
    - job: rust:build_harness
      artifacts: true
  script:
    - env HARNESS_BINARY_SMOKE=1 cargo test -p harness --test binary_smoke -- --ignored --exact
