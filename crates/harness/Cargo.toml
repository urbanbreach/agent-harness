[package]
name = "harness"
description = "CLI entrypoint for the agent-harness event-sourced runtime"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait = "0.1"
clap.workspace = true
crossterm.workspace = true
dotenvy = "0.15"
harness-core = { path = "../harness-core" }
harness-providers = { path = "../harness-providers" }
harness-tools = { path = "../harness-tools" }
harness-tui = { path = "../harness-tui" }
serde.workspace = true
serde_json.workspace = true
json5.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
blake3 = "1"
uuid = { version = "1", features = ["v5"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[dev-dependencies]
harness-testkit = { path = "../harness-testkit" }
portable-pty = "0.9"
sha2 = "0.10"
tempfile.workspace = true
tokio-stream.workspace = true
vt100 = "0.16"

[lints]
workspace = true
