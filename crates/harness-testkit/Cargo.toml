[package]
name = "harness-testkit"
description = "Deterministic test support: fakes, workspaces, simulation evidence"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
vt100 = "0.16"
zbus = "5.14"
harness-core = { path = "../harness-core" }

[dev-dependencies]
base64 = "0.22"
blake3 = "1"
font8x8 = "0.3"
fontdue = "0.9"
insta = { version = "1.42", features = ["json"] }
json5.workspace = true
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "webpki-roots"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio.workspace = true
wiremock = "0.6"

[[test]]
name = "pty_e2e"
path = "tests/pty_e2e.rs"
test = false

[lints]
workspace = true
