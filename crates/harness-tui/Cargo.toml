[package]
name = "harness-tui"
description = "Ratatui TUI for the agent-harness runtime"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1.0"
ratatui.workspace = true
regex = "1"
textwrap = { version = "=0.16.2", default-features = false, features = ["unicode-linebreak", "unicode-width"] }
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.0"
tui-scrollbar = "=0.2.2"
crossterm = { workspace = true, features = ["event-stream"] }
crossbeam-channel.workspace = true
fuzzy-matcher = "0.3"
harness-core = { path = "../harness-core" }
imara-diff = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.11"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "plist-load"] }
two-face = { version = "=0.4.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"
vte = "0.15"
unicode-segmentation = "1.12"

[dev-dependencies]
harness-providers = { path = "../harness-providers" }
harness-testkit = { path = "../harness-testkit" }
image = { version = "0.25", default-features = false, features = ["png"] }
insta = { version = "1.39", features = ["json"] }
tempfile.workspace = true
portable-pty = "0.9"
vt100 = "0.16"

[lints]
workspace = true
