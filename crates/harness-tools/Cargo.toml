[package]
name = "harness-tools"
description = "Native tool surface: fs, edit, bash, task, web, code, lsp, mcp, session"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rustix = { version = "1.1.4", features = ["process"] }
harness-core = { path = "../harness-core" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
schemars.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
async-trait = "0.1"
blake3 = "1"
base64 = "0.22"
tempfile.workspace = true
similar = "3"
globset = "0.4"
ignore = "0.4"
walkdir = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "deflate"] }
encoding_rs = "0.8"
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
futures-util = { version = "0.3", features = ["sink"] }
sse-stream = "0.2.5"
shell-words = "1"
htmd = "0.5"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
flate2 = "1"
tokio = { workspace = true, features = ["net"] }
harness-providers = { path = "../harness-providers" }

[lints]
workspace = true
