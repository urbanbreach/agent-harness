[package]
name = "harness-core"
description = "Core runtime: coordinator, events, permissions, config, projections"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
humantime = "2.1"
serde.workspace = true
serde_json.workspace = true
json5.workspace = true
schemars.workspace = true
thiserror.workspace = true
async-trait = "0.1"
regex = "1"
blake3 = "1"
getrandom = "0.4"
sha2 = "0.11"
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing = "0.1"
which = "8"
similar = "3"
harness-providers = { path = "../harness-providers" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "blocking"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile.workspace = true
insta = { version = "1.42", features = ["json"] }
proptest = "1"

[lints]
workspace = true
