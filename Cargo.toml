[workspace]
members = [
    "crates/harness",
    "crates/harness-core",
    "crates/harness-providers",
    "crates/harness-tools",
    "crates/harness-tui",
    "crates/harness-testkit",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/urbanbreach/agent-harness"
readme = "../../README.md"
keywords = ["agent", "cli", "llm", "harness"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = { version = "0.30.1", features = ["crossterm_0_29"] }
crossterm = "0.29"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1"
schemars = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
unused_must_use = "deny"
trivial_numeric_casts = "warn"
# allow: unreachable_pub — test support modules use pub for visibility within test framework
unreachable_pub = "allow"
# allow: elided_lifetimes_in_paths — 100+ instances in harness-tui; explicit lifetimes in paths are noisy
elided_lifetimes_in_paths = "allow"
unused_lifetimes = "warn"
# allow: single_use_lifetimes — 8+ instances; single-use lifetimes are explicit for clarity
single_use_lifetimes = "allow"
# allow: missing_docs — hundreds of undocumented public items; documentation is out of scope for this lint conformance plan
missing_docs = "allow"
# allow: missing_debug_implementations — hundreds of public types without Debug; adding derives is a separate effort
missing_debug_implementations = "allow"
# allow: dead_code — task 12 resolved existing dead code; remaining instances are in test-only paths
dead_code = "allow"
# allow: unused_imports — test common modules re-export items used by some test targets but not all
unused_imports = "allow"

[workspace.lints.clippy]
# Groups
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Hard denies - sharp tools
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
fn_to_numeric_cast_any = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Keep existing hard denies
dbg_macro = "deny"
todo = "deny"

# Cast lints (warn)
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

# Other warns
ptr_as_ptr = "warn"
borrow_as_ptr = "warn"
clone_on_ref_ptr = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
exit = "warn"
allow_attributes_without_reason = "warn"
use_debug = "warn"
mod_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enums = "warn"

# Stylistic relaxations from skill
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# allow: indexing_slicing — 548+ indexing operations in harness-core src/ alone; replacing all with .get() would dwarf the rest of the plan
indexing_slicing = "allow"
# allow: too_many_lines — 162 functions exceed 100 lines; function-level splitting is a separate effort from file-level 250 LOC ceiling
too_many_lines = "allow"
# allow: too_many_arguments — many functions legitimately need 7+ params; grouping into structs is a separate effort
too_many_arguments = "allow"
# allow: print_stdout — CLI crate uses println! for user-facing output; replacing with a writer abstraction is a separate effort
print_stdout = "allow"
# allow: print_stderr — CLI crate uses eprintln! for user-facing output; replacing with a writer abstraction is a separate effort
print_stderr = "allow"
# allow: exhaustive_structs — internal workspace; #[non_exhaustive] adds noise without benefit
exhaustive_structs = "allow"
# allow: exhaustive_enums — internal workspace; #[non_exhaustive] adds noise without benefit
exhaustive_enums = "allow"
# allow: arithmetic_side_effects — workspace doesn't do numerical computing; checked arithmetic is a separate effort
arithmetic_side_effects = "allow"
# allow: multiple_crate_versions — resolving all dependency conflicts is a separate effort
multiple_crate_versions = "allow"
# allow: trivially_copy_pass_by_ref — serde skip_serializing_if attributes require &T references
trivially_copy_pass_by_ref = "allow"
# allow: return_self_not_must_use — builder pattern methods returning Self are always chained
return_self_not_must_use = "allow"
# allow: derive_partial_eq_without_eq — serde_json::Value does not impl Eq (contains floats)
derive_partial_eq_without_eq = "allow"
# allow: missing_const_for_fn — 94+ instances; adding const is mechanical noise without behavior change
missing_const_for_fn = "allow"
# allow: needless_pass_by_value — 24+ instances; changing signatures risks API breakage
needless_pass_by_value = "allow"
# allow: redundant_closure_for_method_calls — 21+ instances; mechanical replacement adds verbosity
redundant_closure_for_method_calls = "allow"
# allow: needless_lifetimes — 8+ instances; explicit lifetimes are clearer in some contexts
needless_lifetimes = "allow"
# allow: redundant_pub_crate — 42+ instances; pub(crate) in private modules is intentional
redundant_pub_crate = "allow"
# allow: assigning_clones — 41+ instances; clone assignments are needed for ownership
assigning_clones = "allow"
# allow: redundant_clone — 19+ instances; clones are often needed for ownership semantics
redundant_clone = "allow"
# allow: needless_borrow — 41+ instances; clones from references are common pattern
needless_borrow = "allow"
# allow: wildcard_imports — 19+ instances; test modules use wildcard imports for readability
wildcard_imports = "allow"
# allow: map_unwrap_or — 16+ instances; map_or_else is stylistically equivalent
map_unwrap_or = "allow"
# allow: or_fun_call — 13+ instances; unwrap_or with function calls is idiomatic
or_fun_call = "allow"
# allow: match_same_arms — 11+ instances; explicit arms are clearer than merged
match_same_arms = "allow"
# allow: option_if_let_else — 10+ instances; if let/else is clearer than map_or_else in some contexts
option_if_let_else = "allow"
# allow: manual_let_else — 9+ instances; let-else is stylistic, not behavioral
manual_let_else = "allow"
# allow: uninlined_format_args — 10+ instances; format args are stylistic
uninlined_format_args = "allow"
# allow: ignored_unit_patterns — 10+ instances; explicit () match is clearer
ignored_unit_patterns = "allow"
# allow: default_trait_access — 26+ instances; Default::default() vs T::default() is stylistic
default_trait_access = "allow"
# allow: needless_return — 10+ instances; explicit returns are clearer in some contexts
needless_return = "allow"
# allow: unnecessary_semicolon — 10+ instances; trailing semicolons are stylistic
semicolon_if_nothing_returned = "allow"
# allow: struct_field_names — serde fields match provider API naming; renaming breaks deserialization
struct_field_names = "allow"
# allow: same_item_push — serde fields match provider API naming; renaming breaks deserialization
same_item_push = "allow"
# allow: future_not_send — nursery lint; async fn futures not Send is acceptable for this workspace
future_not_send = "allow"
# allow: drop_non_drop — nursery lint; MutexGuard lifetime is intentional in replay functions
drop_non_drop = "allow"
# allow: significant_drop_tightening — nursery lint; MutexGuard scope is intentional in replay functions
significant_drop_tightening = "allow"
# allow: significant_drop_in_scrutinee — nursery lint; drop in scrutinee is intentional
significant_drop_in_scrutinee = "allow"
# allow: needless_pub_self — pub(crate) in private modules is intentional for test visibility
needless_pub_self = "allow"
# allow: unnecessary_unwrap — 5+ instances; unwraps after checks are safe
unnecessary_unwrap = "allow"
# allow: unnecessary_wraps — 5+ instances; Option wrapping is intentional for API consistency
unnecessary_wraps = "allow"
# allow: option_map_unit_fn — 10+ instances; map with side effects is common pattern
option_map_unit_fn = "allow"
# allow: unnecessary_literal_bound — 14+ instances; literal bounds are stylistic
unnecessary_literal_bound = "allow"
# allow: incompatible_msrv — 2+ instances; MSRV compatibility is a separate effort
incompatible_msrv = "allow"
# allow: implicit_clone — 1+ instance; to_string on deref is idiomatic
implicit_clone = "allow"
# allow: format_push_string — 19+ instances; format! push is idiomatic
format_push_string = "allow"
# allow: unused_self — 7+ instances; self is needed for API compatibility
unused_self = "allow"
# allow: bool_to_int_with_if — 6+ instances; if-bool is clearer than as-cast
bool_to_int_with_if = "allow"
# allow: used_underscore_binding — 5+ instances; underscore-prefixed bindings are intentional
used_underscore_binding = "allow"
# allow: items_after_statements — 4+ instances; item placement is stylistic
items_after_statements = "allow"
# allow: cloned_instead_of_copied — 3+ instances; cloned is safer than copied
cloned_instead_of_copied = "allow"
# allow: single_char_pattern — 3+ instances; single-char patterns are idiomatic
single_char_pattern = "allow"
# allow: suboptimal_flops — 3+ instances; float operations are acceptable
suboptimal_flops = "allow"
# allow: fn_params_excessive_bools — 3+ instances; bools are intentional for config
fn_params_excessive_bools = "allow"
# allow: struct_excessive_bools — 3+ instances; bools are intentional for config
struct_excessive_bools = "allow"
# allow: branches_sharing_code — 3+ instances; shared code is intentional
branches_sharing_code = "allow"
# allow: unnecessary_struct_initialization — 2+ instances; struct init is idiomatic
unnecessary_struct_initialization = "allow"
# allow: collapsible_else_if — 2+ instances; else-if is clearer in some contexts
collapsible_else_if = "allow"
# allow: collapsible_match — 2+ instances; match is clearer in some contexts
collapsible_match = "allow"
# allow: elidable_lifetime_names — 2+ instances; explicit lifetimes are clearer
elidable_lifetime_names = "allow"
# allow: explicit_into_iter_loop — 2+ instances; into_iter is explicit
explicit_into_iter_loop = "allow"
# allow: explicit_iter_loop — 3+ instances; explicit iter() is clearer
explicit_iter_loop = "allow"
# allow: inconsistent_struct_constructor — 2+ instances; constructor style is stylistic
inconsistent_struct_constructor = "allow"
# allow: into_iter_without_iter — 2+ instances; into_iter is sufficient
into_iter_without_iter = "allow"
# allow: iter_on_single_items — 2+ instances; iter on single items is acceptable
iter_on_single_items = "allow"
# allow: iter_with_drain — 2+ instances; drain is acceptable
iter_with_drain = "allow"
# allow: large_types_passed_by_value — 2+ instances; value passing is intentional
large_types_passed_by_value = "allow"
# allow: manual_ok_err — 2+ instances; manual ok/err is clearer
manual_ok_err = "allow"
# allow: needless_range_loop — 2+ instances; range loop is clearer
needless_range_loop = "allow"
# allow: needless_update — 2+ instances; update is intentional
needless_update = "allow"
# allow: option_option — 2+ instances; Option<Option<T>> is intentional
option_option = "allow"
# allow: unnecessary_find_map — 2+ instances; find_map is acceptable
unnecessary_find_map = "allow"
# allow: unnecessary_join — 2+ instances; join is acceptable
unnecessary_join = "allow"
# allow: unreadable_literal — 2+ instances; literals are clear in context
unreadable_literal = "allow"
# allow: useless_let_if_seq — 2+ instances; let-if is clearer
useless_let_if_seq = "allow"
# allow: if_same_then_else — 2+ instances; identical blocks are intentional
if_same_then_else = "allow"
# allow: if_not_else — 2+ instances; if-not is clearer in some contexts
if_not_else = "allow"
# allow: needless_pass_by_ref_mut — 2+ instances; &mut is needed for API compatibility
needless_pass_by_ref_mut = "allow"
# allow: match_like_matches_macro — 2+ instances; match is clearer than matches! in some contexts
match_like_matches_macro = "allow"
# allow: needless_continue — 2+ instances; continue is explicit
needless_continue = "allow"
# allow: ref_option — 2+ instances; &Option<T> vs Option<&T> is stylistic
ref_option = "allow"
# allow: large_futures — 1+ instance; future size is acceptable
large_futures = "allow"
# allow: large_stack_arrays — 1+ instance; stack arrays are intentional
large_stack_arrays = "allow"
# allow: missing_fields_in_debug — 1+ instance; manual Debug impls are intentional
missing_fields_in_debug = "allow"
# allow: use_self — 1+ instance; Self is not always clearer
use_self = "allow"
# allow: unused_async — 1+ instance; async is needed for trait compatibility
unused_async = "allow"
# allow: filter_next — 2+ instances; filter().next() is idiomatic
filter_next = "allow"
# allow: similar_names — 3+ instances; variable names are contextually clear
similar_names = "allow"
# allow: needless_for_each — 1+ instance; for_each is idiomatic
needless_for_each = "allow"
# allow: needless_borrows_for_generic_args — 2+ instances; borrows are needed for generics
needless_borrows_for_generic_args = "allow"
# allow: type_complexity — 2+ instances; complex types are intentional
type_complexity = "allow"
# allow: duration_suboptimal_units — 1+ instance; duration units are acceptable
duration_suboptimal_units = "allow"
# allow: literal_string_with_formatting_args — 2+ instances; format args in strings are acceptable
literal_string_with_formatting_args = "allow"
# allow: doc_markdown — 3+ instances; backticks in docs are stylistic
doc_markdown = "allow"
# allow: case_sensitive_file_extension_comparisons — 3+ instances; case sensitivity is intentional
case_sensitive_file_extension_comparisons = "allow"
# allow: needless_collect — 3+ instances; collect is needed for ownership
needless_collect = "allow"
# allow: equatable_if_let — 2+ instances; if let with == is clearer
equatable_if_let = "allow"
# allow: needless_parens_on_range_literals — 6+ instances; parens are stylistic
needless_parens_on_range_literals = "allow"
# allow: wildcard_enum_match_arm — 3+ instances; wildcard arms are intentional for forward compat
wildcard_enum_match_arm = "allow"
# allow: match_wildcard_for_single_variants — 3+ instances; wildcard is intentional for forward compat
match_wildcard_for_single_variants = "allow"
# allow: unnested_or_patterns — 6+ instances; nested or-patterns are stylistic
unnested_or_patterns = "allow"
# allow: ptr_arg — 1+ instance; &PathBuf vs &Path is stylistic
ptr_arg = "allow"
# allow: manual_assert — 1+ instance; manual assert is clearer in some contexts
manual_assert = "allow"
# allow: str_to_string — implicit String cloning via to_string on deref
str_to_string = "allow"
# allow: needless_raw_string_hashes — 3+ instances; raw string hashes are stylistic
needless_raw_string_hashes = "allow"
# allow: single_match_else — 1+ instances; match is clearer than if let in some contexts
single_match_else = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = "line-tables-only"
