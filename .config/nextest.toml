# Deterministic test-suite profiles for the harness workspace.
# T1-T3 are parallel by default; T4/T5 run through explicit lanes.

[profile.default]
retries = 0
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "2s", terminate-after = 10 }
default-filter = 'not test(/perf_/) and not binary(/(binary_smoke|pty_e2e|live_proxy_e2e|native_visual_e2e)/)'


[profile.ci]
inherits = "default"
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"
# GitLab collects this as a JUnit report.
junit = { path = "target/nextest/ci/junit.xml" }

[profile.perf]
inherits = "default"
default-filter = 'test(/perf_/)'
failure-output = "immediate-final"
status-level = "pass"
final-status-level = "none"
junit = { path = "target/nextest/perf/junit.xml" }

[test-groups.process-global-state]
max-threads = 1

# Runner owners create and reap PTY/process trees; serialize this test binary.
[[profile.default.overrides]]
filter = 'binary(=tui_fidelity_runner_test)'
test-group = "process-global-state"

[[profile.default.overrides]]
filter = 'test(dual_binary_cli_pty_ctrl_s_resumes_seeded_session)'
slow-timeout = { period = "10s", terminate-after = 12 }

[[profile.default.overrides]]
filter = 'binary(=reference_authority_receipt_test) and test(=reference_receipt_mutations_fail_closed)'
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'binary(=source_guard_test) and test(/^(source_guard_accepts_(clean_pinned_reference|current_code_input|current_manifest_input|fresh_runtime_output|relative_canonical_reference)|source_guard_rejects_stale_receipt)$/)'
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'binary(=tui_fidelity_runner_test) and test(/^(cached_reference_(requires_exact_presentation_identity|rejects_trace_or_schedule_drift|rejects_trace_artifact_drift)|compare_(writes_dual_runtime_checkpoint_and_cleanup_receipts|rejects_timeout_premature_exit_and_forced_kill_completion)|lifecycle_cases::(hanging_renderer_times_out_and_is_reaped_repeatedly|preexisting_runtime_root_and_sentinel_are_preserved)|packet1_(complete_receipt_passes_all_gates|provenance_rejects_every_bound_identity_mismatch)|presentation_trace_is_native_for_harness_and_external_for_grok|relative_evidence_path_preserves_harness_native_sidecar_across_runtime_cleanup|runner_packet::(compare_writes_explicit_capture_and_comparison_gate_receipt|packet1_controlled_defect_matrix))$/)'
slow-timeout = { period = "30s", terminate-after = 4 }

# The recorded happy path is a three-scenario PTY composite. It can hit a
# transient harness/TUI stall; give it enough outer time so the internal
# 20s marker timeout can print the stuck phase and screen before nextest
# terminates the process.
[[profile.default.overrides]]
filter = 'test(scripted_tui_happy_path_records_start_prompt_permission_tool_edit_resume_and_quit)'
slow-timeout = { period = "30s", terminate-after = 4 }
